[package]
name = "meso-watch"
# The app version shown to users comes from package.json (see
# tauri.conf.json "version"), so this one is never bumped.
version = "0.0.0"
edition = "2021"
license = "GPL-3.0"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input",
  "Win32_UI_WindowsAndMessaging",
] }

# Size-focused release build - lightweight distribution is the point of
# moving off Electron.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
