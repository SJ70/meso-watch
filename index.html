<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>메소워치</title>
  <link rel="stylesheet" href="color.css" />
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <main>
    <header>
      <div>
        <div class="title-row">
          <div>
            <h1>메소워치</h1>
            <p class="subtitle">메이플스토리 재획 타이머</p>
          </div>
        </div>
      </div>
    </header>

    <section class="timer-card" aria-label="PIP 타이머">
      <span class="sr-only" id="time">01:00</span>

      <div class="controls">
        <span class="control-label">시간 선택</span>
        <div class="presets" role="group" aria-label="타이머 시간 선택">
          <button class="preset active" data-minutes="1" type="button">1분</button>
          <button class="preset" data-minutes="2" type="button">2분</button>
          <button class="preset" data-minutes="30" type="button">30분</button>
        </div>
        <div class="shortcut-setting">
          <span class="control-label">재시작 단축키</span>
          <button class="shortcut-input" id="shortcutButton" type="button" aria-label="재시작 단축키 설정">R</button>
          <span class="shortcut-hint" id="shortcutHint">버튼을 누른 뒤 원하는 키를 입력하세요.</span>
        </div>
        <div class="actions">
          <button class="primary" id="pipButton" type="button">시작하기</button>
        </div>
      </div>
    </section>
  </main>

  <script src="pip.js"></script>
  <script>
    const timeElement = document.getElementById("time");
    const presetButtons = document.querySelectorAll(".preset");
    const shortcutButton = document.getElementById("shortcutButton");
    const shortcutHint = document.getElementById("shortcutHint");
    const shortcutStorageKey = "meso-watch-restart-shortcut";

    let totalSeconds = 1 * 60;
    let remainingSeconds = totalSeconds;
    let timerId = null;
    let isSettingShortcut = false;
    let restartShortcut = loadShortcut();

    function loadShortcut() {
      try {
        const savedShortcut = JSON.parse(localStorage.getItem(shortcutStorageKey));
        if (savedShortcut && savedShortcut.key && savedShortcut.code) return savedShortcut;
      } catch (error) {
        localStorage.removeItem(shortcutStorageKey);
      }
      return { key: "r", code: "KeyR", ctrlKey: false, altKey: false, shiftKey: false, metaKey: false };
    }

    function formatShortcut(shortcut) {
      const standaloneModifierNames = {
        control: "Ctrl",
        shift: "Shift",
        alt: "Alt",
        meta: "Meta"
      };
      const standaloneModifier = standaloneModifierNames[shortcut.key];
      if (standaloneModifier) return standaloneModifier;

      const modifiers = [];
      if (shortcut.ctrlKey) modifiers.push("Ctrl");
      if (shortcut.altKey) modifiers.push("Alt");
      if (shortcut.shiftKey) modifiers.push("Shift");
      if (shortcut.metaKey) modifiers.push("Meta");
      const key = shortcut.key.length === 1 ? shortcut.key.toUpperCase() : shortcut.key;
      return [...modifiers, key].join(" + ");
    }

    function updateShortcutDisplay() {
      const shortcutLabel = formatShortcut(restartShortcut);
      shortcutButton.textContent = shortcutLabel;
      window.pipController.setShortcut(shortcutLabel, restartShortcut);
    }

    function matchesShortcut(event) {
      return event.key.toLowerCase() === restartShortcut.key
        && event.ctrlKey === restartShortcut.ctrlKey
        && event.altKey === restartShortcut.altKey
        && event.shiftKey === restartShortcut.shiftKey
        && event.metaKey === restartShortcut.metaKey;
    }

    function render() {
      const minutes = Math.floor(remainingSeconds / 60).toString().padStart(2, "0");
      const seconds = (remainingSeconds % 60).toString().padStart(2, "0");

      timeElement.textContent = `${minutes}:${seconds}`;
      window.pipController.draw(`${minutes}:${seconds}`);
      document.title = "메소워치";
    }

    function notifyDone() {
      if (typeof AudioContext !== "undefined") {
        const audioContext = new AudioContext();
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.frequency.value = 660;
        gain.gain.setValueAtTime(0.08, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.5);
        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.5);
      }
    }

    function tick() {
      if (remainingSeconds <= 1) {
        stopTimer();
        remainingSeconds = 0;
        notifyDone();
        render();
        return;
      }
      remainingSeconds -= 1;
      render();
    }

    function startTimer() {
      if (timerId || remainingSeconds === 0) return;
      timerId = setInterval(tick, 1000);
      window.pipController.setRunning(true);
    }

    function stopTimer() {
      clearInterval(timerId);
      timerId = null;
      window.pipController.setRunning(false);
    }

    function resetTimer() {
      stopTimer();
      remainingSeconds = totalSeconds;
      render();
    }

    function restartTimer() {
      stopTimer();
      remainingSeconds = totalSeconds;
      startTimer();
      render();
    }

    shortcutButton.addEventListener("click", () => {
      isSettingShortcut = true;
      shortcutButton.textContent = "입력 중...";
          shortcutHint.textContent = "재시작에 사용할 키 또는 조합을 입력하세요. Esc로 취소할 수 있습니다.";
    });

    window.addEventListener("keydown", (event) => {
      if (isSettingShortcut) {
        event.preventDefault();
        if (event.key === "Escape") {
          isSettingShortcut = false;
          shortcutHint.textContent = "버튼을 누른 뒤 원하는 키를 입력하세요.";
          updateShortcutDisplay();
          return;
        }
        restartShortcut = {
          key: event.key.toLowerCase(),
          code: event.code,
          ctrlKey: event.ctrlKey,
          altKey: event.altKey,
          shiftKey: event.shiftKey,
          metaKey: event.metaKey
        };
        localStorage.setItem(shortcutStorageKey, JSON.stringify(restartShortcut));
        isSettingShortcut = false;
        shortcutHint.textContent = "이 키로 타이머를 재시작합니다.";
        updateShortcutDisplay();
        return;
      }

      if (!event.repeat && matchesShortcut(event)) {
        event.preventDefault();
        restartTimer();
      }
    });

    document.getElementById("pipButton").addEventListener("click", async () => {
      const isOpen = await window.pipController.toggle();
      if (isOpen === true) {
        if (remainingSeconds === 0) remainingSeconds = totalSeconds;
        startTimer();
      } else if (isOpen === false) {
        stopTimer();
      }
      render();
    });

    window.addEventListener("pipplay", startTimer);
    window.addEventListener("pipstop", stopTimer);
    window.addEventListener("pipreset", resetTimer);
    window.addEventListener("piprestart", restartTimer);

    window.addEventListener("pipclosed", () => {
      stopTimer();
      render();
    });

    presetButtons.forEach((button) => {
      button.addEventListener("click", () => {
        presetButtons.forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        resetTimer();
        totalSeconds = Number(button.dataset.minutes) * 60;
        remainingSeconds = totalSeconds;
        render();
      });
    });

    updateShortcutDisplay();
    render();
  </script>
</body>
</html>
