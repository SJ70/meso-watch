<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>메소워치</title>
  <link rel="icon" type="image/png" href="../public/meso.png" />
  <link rel="stylesheet" href="css/color.css" />
  <link rel="stylesheet" href="css/index.css" />
  <script>
    if (window.electronAPI) {
      const electronStylesheet = document.createElement("link");
      electronStylesheet.rel = "stylesheet";
      electronStylesheet.href = "css/electron.css";
      document.head.appendChild(electronStylesheet);

      const rawBgOpacity = localStorage.getItem("meso-watch-bg-opacity");
      const rawPanelOpacity = localStorage.getItem("meso-watch-panel-opacity");
      const storedBgOpacity = rawBgOpacity === null ? NaN : Number(rawBgOpacity);
      const storedPanelOpacity = rawPanelOpacity === null ? NaN : Number(rawPanelOpacity);
      const bgOpacity = Number.isFinite(storedBgOpacity) && storedBgOpacity >= 0 && storedBgOpacity <= 100 ? storedBgOpacity : 0;
      const panelOpacity = Number.isFinite(storedPanelOpacity) && storedPanelOpacity >= 0 && storedPanelOpacity <= 100 ? storedPanelOpacity : 75;
      document.documentElement.style.setProperty("--bg-opacity", bgOpacity / 100);
      document.documentElement.style.setProperty("--panel-opacity", panelOpacity / 100);
    }
  </script>
</head>
<body>
  <main>
    <header>
      <div class="title-row">
        <img class="app-logo" src="../public/meso.png" alt="" />
        <div>
          <h1>메소워치<span class="version-tag" id="versionTag"></span></h1>
          <p class="subtitle">메이플스토리 재획 타이머</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="settings-toggle add-timer" id="addTimerButton" type="button" aria-label="타이머 추가"></button>
        <button class="settings-toggle screen-settings-button" id="screenSettingsButton" type="button" aria-label="설정"></button>
        <button class="settings-toggle close-button" id="closeButton" type="button" aria-label="닫기"></button>
      </div>
    </header>
    <section class="timer-list" id="timerList" aria-label="등록된 타이머"></section>
  </main>

  <dialog class="settings-modal confirm-modal" id="confirmDialog" aria-label="삭제 확인">
    <div class="settings-modal-header">
      <span class="section-title">타이머 삭제</span>
    </div>
    <p class="confirm-message" id="confirmMessage"></p>
    <div class="settings-actions">
      <button class="secondary" id="confirmCancelButton" type="button">취소</button>
      <button class="primary" id="confirmDeleteButton" type="button">삭제</button>
    </div>
  </dialog>

  <dialog class="settings-modal" id="screenSettingsDialog" aria-label="설정">
    <div class="settings-modal-header">
      <span class="section-title">설정</span>
    </div>
    <div class="opacity-setting">
      <div class="opacity-setting-header">
        <span class="control-label">마스터 볼륨</span>
        <span class="duration-hint" id="masterVolumeValue"></span>
      </div>
      <input class="opacity-slider" id="masterVolumeSlider" type="range" min="0" max="100" step="1" aria-label="마스터 볼륨" />
    </div>
    <div class="opacity-setting">
      <div class="opacity-setting-header">
        <span class="control-label">배경 투명도</span>
        <span class="duration-hint" id="bgOpacityValue"></span>
      </div>
      <input class="opacity-slider" id="bgOpacitySlider" type="range" min="0" max="100" step="1" aria-label="배경 투명도" />
    </div>
    <div class="opacity-setting">
      <div class="opacity-setting-header">
        <span class="control-label">버튼 투명도</span>
        <span class="duration-hint" id="panelOpacityValue"></span>
      </div>
      <input class="opacity-slider" id="panelOpacitySlider" type="range" min="0" max="100" step="1" aria-label="버튼 투명도" />
    </div>
    <div class="settings-actions">
      <button class="secondary" id="screenSettingsCancelButton" type="button">취소</button>
      <button class="primary" id="screenSettingsConfirmButton" type="button">확인</button>
    </div>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
