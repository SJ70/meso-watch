<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>메소워치</title>
  <link rel="icon" type="image/png" href="../public/meso.png" />
  <link rel="stylesheet" href="color.css" />
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <main>
    <header>
      <div class="title-row">
        <img class="app-logo" src="../public/meso.png" alt="" />
        <div>
          <h1>메소워치</h1>
          <p class="subtitle">메이플스토리 재획 타이머</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="volume-control" id="volumeControl">
          <button class="volume-toggle" id="volumeToggleButton" type="button" aria-label="음량 조절 열기"></button>
          <input class="volume-slider" id="volumeSlider" type="range" min="0" max="100" step="1" aria-label="알림 음량" />
        </div>
        <button class="primary add-timer" id="addTimerButton" type="button" aria-label="타이머 추가"></button>
      </div>
    </header>
    <section class="timer-list" id="timerList" aria-label="등록된 타이머"></section>
  </main>

  <dialog class="settings-modal confirm-modal" id="confirmDialog" aria-label="삭제 확인">
    <div class="settings-modal-header">
      <span class="section-title">타이머 삭제</span>
    </div>
    <p class="confirm-message" id="confirmMessage"></p>
    <div class="settings-actions">
      <button class="secondary" id="confirmCancelButton" type="button">취소</button>
      <button class="primary" id="confirmDeleteButton" type="button">삭제</button>
    </div>
  </dialog>

  <script type="module">
    import createIconElement from "../node_modules/lucide/dist/esm/createElement.mjs";
    import Volume1Icon from "../node_modules/lucide/dist/esm/icons/volume-1.mjs";
    import Volume2Icon from "../node_modules/lucide/dist/esm/icons/volume-2.mjs";
    import VolumeXIcon from "../node_modules/lucide/dist/esm/icons/volume-x.mjs";
    import AlarmClockPlusIcon from "../node_modules/lucide/dist/esm/icons/alarm-clock-plus.mjs";
    import SettingsIcon from "../node_modules/lucide/dist/esm/icons/settings.mjs";
    import TrashIcon from "../node_modules/lucide/dist/esm/icons/trash.mjs";
    import PlayIcon from "../node_modules/lucide/dist/esm/icons/play.mjs";
    import PauseIcon from "../node_modules/lucide/dist/esm/icons/pause.mjs";
    import SquareIcon from "../node_modules/lucide/dist/esm/icons/square.mjs";
    import RotateCcwIcon from "../node_modules/lucide/dist/esm/icons/rotate-ccw.mjs";

    const timerList = document.getElementById("timerList");
    const addTimerButton = document.getElementById("addTimerButton");
    addTimerButton.appendChild(createIconElement(AlarmClockPlusIcon, { width: 18, height: 18 }));
    const volumeControl = document.getElementById("volumeControl");
    const volumeSlider = document.getElementById("volumeSlider");
    const volumeToggleButton = document.getElementById("volumeToggleButton");

    const confirmDialog = document.getElementById("confirmDialog");
    const confirmMessage = document.getElementById("confirmMessage");
    const confirmCancelButton = document.getElementById("confirmCancelButton");
    const confirmDeleteButton = document.getElementById("confirmDeleteButton");
    let pendingDeleteTimer = null;

    confirmCancelButton.addEventListener("click", () => {
      pendingDeleteTimer = null;
      confirmDialog.close();
    });
    confirmDeleteButton.addEventListener("click", () => {
      if (pendingDeleteTimer) removeTimer(pendingDeleteTimer);
      pendingDeleteTimer = null;
      confirmDialog.close();
    });
    confirmDialog.addEventListener("cancel", () => {
      pendingDeleteTimer = null;
    });

    function loadVolume() {
      const stored = Number(localStorage.getItem("meso-watch-volume"));
      return Number.isFinite(stored) && stored >= 0 && stored <= 100 ? stored : 50;
    }

    let volume = loadVolume();
    let lastNonZeroVolume = volume || 50;

    const volumeIcons = {
      "volume-x": VolumeXIcon,
      "volume-1": Volume1Icon,
      "volume-2": Volume2Icon
    };

    function volumeIconName(level) {
      if (level === 0) return "volume-x";
      if (level <= 50) return "volume-1";
      return "volume-2";
    }

    function updateVolumeUi() {
      volumeSlider.value = volume;
      volumeToggleButton.replaceChildren(createIconElement(volumeIcons[volumeIconName(volume)], { width: 18, height: 18 }));
      volumeToggleButton.setAttribute("aria-label", volumeControl.classList.contains("is-open") ? "음량 조절 닫기" : "음량 조절 열기");
    }

    function setVolume(value) {
      volume = Math.min(100, Math.max(0, value));
      if (volume > 0) lastNonZeroVolume = volume;
      localStorage.setItem("meso-watch-volume", String(volume));
      updateVolumeUi();
    }

    function setVolumePopoverOpen(open) {
      volumeControl.classList.toggle("is-open", open);
      updateVolumeUi();
    }

    volumeSlider.addEventListener("input", (event) => setVolume(Number(event.target.value)));
    volumeSlider.addEventListener("change", () => playNotifySound(volume));
    volumeToggleButton.addEventListener("click", (event) => {
      event.stopPropagation();
      setVolumePopoverOpen(!volumeControl.classList.contains("is-open"));
    });
    document.addEventListener("click", (event) => {
      if (!volumeControl.classList.contains("is-open")) return;
      if (!volumeControl.contains(event.target)) setVolumePopoverOpen(false);
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && volumeControl.classList.contains("is-open")) setVolumePopoverOpen(false);
    });
    updateVolumeUi();

    function loadNextTimerId() {
      let maxUsedId = 0;
      for (let i = 0; i < localStorage.length; i++) {
        const match = localStorage.key(i)?.match(/^meso-watch-timer-(\d+)-(name|shortcut|duration)$/);
        if (match) maxUsedId = Math.max(maxUsedId, Number(match[1]));
      }
      const stored = Number(localStorage.getItem("meso-watch-next-timer-id")) || 0;
      return Math.max(maxUsedId + 1, stored, 1);
    }

    function setNextTimerId(value) {
      nextTimerId = value;
      localStorage.setItem("meso-watch-next-timer-id", String(nextTimerId));
    }

    let nextTimerId = loadNextTimerId();
    let timers = [];
    let recordingTimer = null;

    function defaultShortcut(timerId) {
      return null;
    }

    function loadShortcut(timerId) {
      try {
        const raw = localStorage.getItem(`meso-watch-timer-${timerId}-shortcut`);
        if (raw === null) return defaultShortcut(timerId);
        const saved = JSON.parse(raw);
        if (saved === null) return null;
        if (saved && saved.key && saved.code) return saved;
      } catch (error) {
        localStorage.removeItem(`meso-watch-timer-${timerId}-shortcut`);
      }
      return defaultShortcut(timerId);
    }

    function saveShortcuts() {
      timers.forEach((timer) => localStorage.setItem(`meso-watch-timer-${timer.id}-shortcut`, JSON.stringify(timer.shortcut)));
      window.electronAPI?.setGlobalShortcuts(timers.filter((timer) => timer.shortcut).map((timer) => ({ id: timer.id, shortcut: timer.shortcut })));
    }

    function formatShortcut(shortcut) {
      if (!shortcut) return "없음";
      const standaloneModifiers = {
        control: "Ctrl",
        ctrl: "Ctrl",
        alt: "Alt",
        shift: "Shift",
        meta: "Meta",
        command: "Meta",
        win: "Meta"
      };
      const standaloneModifier = standaloneModifiers[shortcut.key];
      if (standaloneModifier) return standaloneModifier;

      if (shortcut.key === " " || shortcut.key === "space" || shortcut.key === "spacebar") return "Spacebar";

      const modifiers = [];
      if (shortcut.ctrlKey) modifiers.push("Ctrl");
      if (shortcut.altKey) modifiers.push("Alt");
      if (shortcut.shiftKey) modifiers.push("Shift");
      if (shortcut.metaKey) modifiers.push("Meta");
      return [...modifiers, shortcut.key.toUpperCase()].join(" + ");
    }

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60).toString().padStart(2, "0");
      const remainingSeconds = (seconds % 60).toString().padStart(2, "0");
      return `${minutes}:${remainingSeconds}`;
    }

    function escapeHtml(value) {
      return value.replace(/[&<>'"]/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&#39;",
        "\"": "&quot;"
      }[character]));
    }

    function defaultTimerName(timer) {
      const index = timer ? timers.indexOf(timer) : -1;
      return `타이머 ${index >= 0 ? index + 1 : timers.length + 1}`;
    }

    function loadDuration(timerId) {
      const stored = Number(localStorage.getItem(`meso-watch-timer-${timerId}-duration`));
      return Number.isFinite(stored) && stored > 0 ? stored : null;
    }

    function saveDuration(timer) {
      localStorage.setItem(`meso-watch-timer-${timer.id}-duration`, String(timer.totalSeconds));
    }

    function loadTimerIds() {
      try {
        const raw = JSON.parse(localStorage.getItem("meso-watch-timer-ids") || "[]");
        return Array.isArray(raw) ? raw.filter((id) => Number.isInteger(id)) : [];
      } catch (error) {
        return [];
      }
    }

    function saveTimerIds() {
      localStorage.setItem("meso-watch-timer-ids", JSON.stringify(timers.map((timer) => timer.id)));
    }

    function buildTimer(id, totalSeconds, fallbackIndex = null) {
      const name = localStorage.getItem(`meso-watch-timer-${id}-name`)
        || (fallbackIndex === null ? defaultTimerName(null) : `타이머 ${fallbackIndex + 1}`);
      return { id, name, totalSeconds, remainingSeconds: totalSeconds, timerId: null, shortcut: loadShortcut(id), isDraft: false };
    }

    function createTimer(minutes = 1) {
      const id = nextTimerId;
      setNextTimerId(nextTimerId + 1);
      return buildTimer(id, minutes * 60);
    }

    function getTimerElement(timer) {
      if (timer.element?.isConnected) return timer.element;
      return timerList.querySelector(`[data-timer-id="${timer.id}"]`);
    }

    function updateTimerElement(timer) {
      const element = getTimerElement(timer);
      if (!element) return;
      element.querySelector(".timer-time").textContent = formatTime(timer.remainingSeconds);
      if (recordingTimer !== timer) {
        element.querySelector(".shortcut-button").value = formatShortcut(timer.shortcut);
      }
      element.querySelector(".timer-shortcut-badge").textContent = formatShortcut(timer.shortcut);
      element.classList.toggle("is-running", Boolean(timer.timerId));
      element.classList.toggle("is-finished", Boolean(timer.isFinished));
      const progress = timer.totalSeconds > 0 ? (timer.remainingSeconds / timer.totalSeconds) * 100 : 0;
      element.style.setProperty("--progress", `${progress}%`);
      element.querySelector(".start-button").disabled = Boolean(timer.timerId);
      element.querySelector(".pause-button").disabled = !timer.timerId;
    }

    function renderTimer(timer, target = timerList) {
      const element = document.createElement("article");
      element.className = "timer-card";
      element.draggable = true;
      element.dataset.timerId = timer.id;
      timer.element = element;
      element.innerHTML = `
        <div class="timer-card-header">
          <span class="timer-shortcut-badge">${formatShortcut(timer.shortcut)}</span>
          <span class="timer-label">${escapeHtml(timer.name)}</span>
          <button class="settings-toggle" type="button" aria-label="타이머 설정"></button>
        </div>
        <section class="timer-progress" aria-label="타이머 진행">
          <div class="timer-display">
            <strong class="timer-time">${formatTime(timer.remainingSeconds)}</strong>
          </div>
          <div class="timer-actions">
            <div class="timer-actions-group">
              <button class="timer-action start-button" type="button" aria-label="시작하기"></button>
              <button class="timer-action pause-button" type="button" aria-label="일시정지"></button>
              <button class="timer-action reset-button" type="button" aria-label="정지"></button>
              <button class="timer-action restart-button" type="button" aria-label="재시작"></button>
            </div>
            <button class="timer-action remove-button" type="button" aria-label="타이머 ${timer.id} 삭제"></button>
          </div>
        </section>
        <dialog class="settings-modal" aria-label="타이머 설정">
          <div class="settings-modal-header">
            <span class="section-title">타이머 설정</span>
          </div>
          <label class="name-field">
            <span class="control-label">이름</span>
            <input class="name-input" type="text" maxlength="30" value="${escapeHtml(timer.name)}" aria-label="타이머 이름" />
          </label>
          <div class="duration-setting">
            <div class="duration-setting-header">
              <span class="control-label">시간</span>
              <span class="duration-hint">마우스 휠로 조절 가능</span>
            </div>
            <div class="duration-fields" aria-label="타이머 ${timer.id} 시간 입력">
              <input class="duration-input minutes-input" type="text" inputmode="numeric" pattern="[0-9]*" value="${Math.floor(timer.totalSeconds / 60)}" aria-label="타이머 ${timer.id} 분" />
              <span class="duration-separator" aria-hidden="true">:</span>
              <input class="duration-input seconds-input" type="text" inputmode="numeric" pattern="[0-9]*" value="${timer.totalSeconds % 60}" aria-label="타이머 ${timer.id} 초" />
            </div>
          </div>
          <div class="shortcut-setting timer-shortcut-setting">
            <span class="control-label">재시작 단축키</span>
            <input class="shortcut-input shortcut-button" type="text" readonly autocomplete="off" aria-label="타이머 ${timer.id} 단축키 설정" value="${escapeHtml(formatShortcut(timer.shortcut))}" />
          </div>
          <div class="settings-actions">
            <button class="secondary modal-close" type="button">취소</button>
            <button class="primary modal-save" type="button">${timer.isDraft ? "완료" : "저장"}</button>
          </div>
        </dialog>`;

      const settingsModal = element.querySelector(".settings-modal");
      element.querySelector(".settings-toggle").appendChild(createIconElement(SettingsIcon, { width: 16, height: 16 }));
      element.querySelector(".remove-button").appendChild(createIconElement(TrashIcon, { width: 16, height: 16 }));
      element.querySelector(".start-button").appendChild(createIconElement(PlayIcon, { width: 16, height: 16 }));
      element.querySelector(".pause-button").appendChild(createIconElement(PauseIcon, { width: 16, height: 16 }));
      element.querySelector(".reset-button").appendChild(createIconElement(SquareIcon, { width: 16, height: 16 }));
      element.querySelector(".restart-button").appendChild(createIconElement(RotateCcwIcon, { width: 16, height: 16 }));
      element.addEventListener("dragstart", (event) => {
        if (event.target.closest("button, input, dialog")) {
          event.preventDefault();
          return;
        }
        element.classList.add("is-dragging");
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", String(timer.id));
      });
      element.addEventListener("dragend", () => {
        element.classList.remove("is-dragging");
        document.querySelectorAll(".timer-card.is-drag-over").forEach((item) => item.classList.remove("is-drag-over"));
      });
      element.addEventListener("dragover", (event) => {
        event.preventDefault();
        event.dataTransfer.dropEffect = "move";
        if (!element.classList.contains("is-dragging")) element.classList.add("is-drag-over");
      });
      element.addEventListener("dragleave", () => element.classList.remove("is-drag-over"));
      element.addEventListener("drop", (event) => {
        event.preventDefault();
        const draggedId = Number(event.dataTransfer.getData("text/plain"));
        const fromIndex = timers.findIndex((item) => item.id === draggedId);
        const toIndex = timers.indexOf(timer);
        if (fromIndex < 0 || fromIndex === toIndex) return;
        const [draggedTimer] = timers.splice(fromIndex, 1);
        timers.splice(toIndex, 0, draggedTimer);
        renderAllTimers();
        saveTimerIds();
      });
      element.querySelector(".settings-toggle").addEventListener("click", () => settingsModal.showModal());
      element.querySelector(".modal-close").addEventListener("click", () => {
        cancelShortcutRecording(timer);
        settingsModal.close();
        if (timer.isDraft) {
          localStorage.removeItem(`meso-watch-timer-${timer.id}-name`);
          localStorage.removeItem(`meso-watch-timer-${timer.id}-shortcut`);
          localStorage.removeItem(`meso-watch-timer-${timer.id}-duration`);
          if (timer.id === nextTimerId - 1) setNextTimerId(nextTimerId - 1);
          element.parentElement?.remove();
        }
      });
      element.querySelector(".modal-save").addEventListener("click", () => {
        cancelShortcutRecording(timer);
        if (timer.isDraft) {
          timer.isDraft = false;
          timers.push(timer);
          const draftHost = element.parentElement;
          timerList.appendChild(element);
          draftHost?.remove();
          saveTimerIds();
        }
        saveDuration(timer);
        saveShortcuts();
        settingsModal.close();
      });
      settingsModal.addEventListener("cancel", (event) => {
        cancelShortcutRecording(timer);
        if (timer.isDraft) {
          event.preventDefault();
          settingsModal.close();
          localStorage.removeItem(`meso-watch-timer-${timer.id}-name`);
          localStorage.removeItem(`meso-watch-timer-${timer.id}-shortcut`);
          localStorage.removeItem(`meso-watch-timer-${timer.id}-duration`);
          if (timer.id === nextTimerId - 1) setNextTimerId(nextTimerId - 1);
          element.parentElement?.remove();
        }
      });
      element.querySelector(".name-input").addEventListener("change", (event) => {
        timer.name = event.target.value.trim() || defaultTimerName(timer);
        event.target.value = timer.name;
        localStorage.setItem(`meso-watch-timer-${timer.id}-name`, timer.name);
        element.querySelector(".timer-label").textContent = timer.name;
      });
      const durationInputMax = (input) => (input.classList.contains("seconds-input") ? 59 : 60);
      element.querySelectorAll(".duration-input").forEach((input) => input.addEventListener("input", (event) => {
        event.target.value = event.target.value.replace(/\D/g, "");
        if (Number(event.target.value) > durationInputMax(event.target)) event.target.value = "0";
      }));
      element.querySelectorAll(".duration-input").forEach((input) => input.addEventListener("wheel", (event) => {
        event.preventDefault();
        const delta = event.deltaY < 0 ? 1 : -1;
        input.value = Math.min(durationInputMax(input), Math.max(0, (Number(input.value) || 0) + delta));
        input.dispatchEvent(new Event("change"));
      }, { passive: false }));
      element.querySelectorAll(".duration-input").forEach((input) => input.addEventListener("change", () => {
        const minutesInput = element.querySelector(".minutes-input");
        const secondsInput = element.querySelector(".seconds-input");
        const minutes = Math.min(60, Math.max(0, Number(minutesInput.value) || 0));
        const seconds = Math.min(59, Math.max(0, Number(secondsInput.value) || 0));
        const totalSeconds = minutes * 60 + seconds;
        if (totalSeconds === 0) {
          minutesInput.value = 0;
          secondsInput.value = 1;
          timer.totalSeconds = 1;
        } else {
          minutesInput.value = minutes;
          secondsInput.value = seconds;
          timer.totalSeconds = totalSeconds;
        }
        resetTimer(timer);
        timer.remainingSeconds = timer.totalSeconds;
        updateTimerElement(timer);
        if (!timer.isDraft) saveDuration(timer);
      }));
      element.querySelector(".shortcut-button").addEventListener("click", () => {
        recordingTimer = timer;
        const shortcutButton = element.querySelector(".shortcut-button");
        shortcutButton.classList.add("is-setting-shortcut");
        shortcutButton.value = "원하는 키를 입력하세요 (Esc: 제거)";
      });
      element.querySelector(".start-button").addEventListener("click", () => startTimer(timer));
      element.querySelector(".pause-button").addEventListener("click", () => stopTimer(timer));
      element.querySelector(".reset-button").addEventListener("click", () => resetTimer(timer));
      element.querySelector(".restart-button").addEventListener("click", () => restartTimer(timer));
      element.querySelector(".remove-button").addEventListener("click", () => confirmDeleteTimer(timer));
      target.appendChild(element);
      updateTimerElement(timer);
    }

    function renderAllTimers() {
      timerList.replaceChildren();
      timers.forEach((timer) => renderTimer(timer));
    }

    function playNotifySound(level) {
      if (typeof AudioContext === "undefined" || level === 0) return;
      const audioContext = new AudioContext();
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.frequency.value = 660;
      const peakGain = 0.16 * (level / 100);
      gain.gain.setValueAtTime(peakGain, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.5);
      oscillator.start();
      oscillator.stop(audioContext.currentTime + 0.5);
    }

    function notifyDone() {
      playNotifySound(volume);
    }

    function tickTimer(timer) {
      if (timer.remainingSeconds <= 1) {
        stopTimer(timer);
        timer.remainingSeconds = 0;
        timer.isFinished = true;
        updateTimerElement(timer);
        notifyDone();
        return;
      }
      timer.remainingSeconds -= 1;
      updateTimerElement(timer);
    }

    function startTimer(timer) {
      if (timer.timerId || timer.remainingSeconds === 0) return;
      timer.isFinished = false;
      timer.timerId = setInterval(() => tickTimer(timer), 1000);
      updateTimerElement(timer);
    }

    function stopTimer(timer) {
      clearInterval(timer.timerId);
      timer.timerId = null;
      updateTimerElement(timer);
    }

    function resetTimer(timer) {
      stopTimer(timer);
      timer.remainingSeconds = timer.totalSeconds;
      timer.isFinished = false;
      updateTimerElement(timer);
    }

    function restartTimer(timer) {
      stopTimer(timer);
      timer.remainingSeconds = timer.totalSeconds;
      timer.isFinished = false;
      startTimer(timer);
      updateTimerElement(timer);
    }

    function removeTimer(timer) {
      stopTimer(timer);
      localStorage.removeItem(`meso-watch-timer-${timer.id}-name`);
      localStorage.removeItem(`meso-watch-timer-${timer.id}-shortcut`);
      localStorage.removeItem(`meso-watch-timer-${timer.id}-duration`);
      timers = timers.filter((item) => item !== timer);
      timer.element = null;
      renderAllTimers();
      saveTimerIds();
      saveShortcuts();
    }

    function confirmDeleteTimer(timer) {
      confirmMessage.textContent = `"${timer.name}" 타이머를 삭제할까요?`;
      pendingDeleteTimer = timer;
      confirmDialog.showModal();
    }

    function restartTimerById(timerId) {
      const timer = timers.find((item) => item.id === timerId);
      if (timer) restartTimer(timer);
    }

    function cancelShortcutRecording(timer) {
      if (recordingTimer !== timer) return;
      recordingTimer = null;
      const element = getTimerElement(timer);
      if (!element) return;
      const shortcutButton = element.querySelector(".shortcut-button");
      shortcutButton.classList.remove("is-setting-shortcut");
      shortcutButton.blur();
      shortcutButton.value = formatShortcut(timer.shortcut);
    }

    window.addEventListener("keydown", (event) => {
      if (recordingTimer !== null) {
        event.preventDefault();
        const timer = recordingTimer;
        const element = getTimerElement(timer);
        if (event.key === "Escape") {
          timer.shortcut = null;
          recordingTimer = null;
          const shortcutButton = element.querySelector(".shortcut-button");
          shortcutButton.classList.remove("is-setting-shortcut");
          shortcutButton.blur();
          updateTimerElement(timer);
          saveShortcuts();
          return;
        }
        timer.shortcut = { key: event.key.toLowerCase(), code: event.code, ctrlKey: event.ctrlKey, altKey: event.altKey, shiftKey: event.shiftKey, metaKey: event.metaKey };
        recordingTimer = null;
        const shortcutButton = element.querySelector(".shortcut-button");
        shortcutButton.classList.remove("is-setting-shortcut");
        shortcutButton.blur();
        updateTimerElement(timer);
        saveShortcuts();
        return;
      }

      if (window.electronAPI || event.repeat) return;
      timers.forEach((timer) => {
        const shortcut = timer.shortcut;
        if (!shortcut) return;
        if (event.key.toLowerCase() === shortcut.key && event.ctrlKey === shortcut.ctrlKey && event.altKey === shortcut.altKey && event.shiftKey === shortcut.shiftKey && event.metaKey === shortcut.metaKey) restartTimer(timer);
      });
    });

    addTimerButton.addEventListener("click", () => {
      const timer = createTimer();
      timer.isDraft = true;
      const draftHost = document.createElement("div");
      draftHost.className = "draft-host";
      document.body.appendChild(draftHost);
      renderTimer(timer, draftHost);
      draftHost.querySelector(".settings-modal").showModal();
    });

    timers = loadTimerIds().map((id, index) => buildTimer(id, loadDuration(id) ?? 60, index));
    renderAllTimers();
    saveShortcuts();

    window.electronAPI?.onGlobalRestart(restartTimerById);
  </script>
</body>
</html>
